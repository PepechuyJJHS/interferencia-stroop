<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <!-- Configuración estricta para evitar zoom y comportarse como app nativa -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Interferencia Stroop</title>
  <style>
    /* Diseño inmersivo a pantalla completa */
    :root { --bg: #09090b; --text: #f8fafc; }
    body, html { 
      margin: 0; padding: 0; height: 100%; width: 100%; 
      background: var(--bg); color: var(--text); 
      font-family: 'Segoe UI', system-ui, sans-serif; 
      /* Elimina el retraso táctil del navegador */
      touch-action: manipulation; 
      user-select: none; 
      overflow: hidden;
    }
    
    .container { 
      display: flex; flex-direction: column; 
      height: 100vh; padding: 4vh 5vw; box-sizing: border-box; 
      justify-content: space-between;
    }

    /* Zona del estímulo visual gigantesca */
    #stimulus { 
      flex-grow: 1; display: flex; align-items: center; justify-content: center; 
      font-size: 18vw; font-weight: 900; letter-spacing: 3px; 
      text-transform: uppercase; text-shadow: 0 0 20px rgba(255,255,255,0.1);
    }

    /* Panel de métricas dinámico */
    #feedback { 
      height: 15vh; display: flex; flex-direction: column; 
      justify-content: center; align-items: center; text-align: center;
      background: #18181b; border-radius: 16px; margin-bottom: 2vh;
      border: 1px solid #27272a;
    }
    .metric { font-size: 2rem; font-weight: bold; color: #38bdf8; }
    .analysis { font-size: 1rem; color: #a1a1aa; margin-top: 5px; }

    /* Botones masivos para fácil contacto visual y táctil */
    .controls { display: flex; gap: 4vw; height: 15vh; }
    button { 
      flex: 1; border: none; border-radius: 20px; 
      font-size: 1.5rem; font-weight: 800; text-transform: uppercase; 
      cursor: pointer; transition: opacity 0.1s; 
    }
    button:active { opacity: 0.7; }
    
    #btn-start { background: #38bdf8; color: #09090b; width: 100%; }
    #btn-match { background: #10b981; color: white; display: none; }
    #btn-mismatch { background: #ef4444; color: white; display: none; }
  </style>
</head>
<body>

  <div class="container">
    <div id="feedback">
      <div style="color: #71717a; font-size: 1.2rem;">SISTEMA EN ESPERA</div>
    </div>

    <div id="stimulus">ESTÍMULO</div>

    <div class="controls">
      <!-- Cambiamos onclick por onpointerdown para latencia CERO -->
      <button id="btn-start" onpointerdown="iniciarSecuencia()">Comenzar</button>
      <button id="btn-match" onpointerdown="registrar(true)">IGUAL</button>
      <button id="btn-mismatch" onpointerdown="registrar(false)">DISTINTO</button>
    </div>
  </div>

  <script>
    const estimulos = [
      { texto: "ROJO", color: "#ef4444", igual: true },
      { texto: "VERDE", color: "#10b981", igual: true },
      { texto: "AZUL", color: "#3b82f6", igual: true },
      { texto: "ROJO", color: "#10b981", igual: false },
      { texto: "VERDE", color: "#3b82f6", igual: false },
      { texto: "AZUL", color: "#ef4444", igual: false }
    ];

    let tInicio = 0, actual = null;
    const uiCaja = document.getElementById('stimulus');
    const uiFeed = document.getElementById('feedback');
    const bStart = document.getElementById('btn-start');
    const bMatch = document.getElementById('btn-match');
    const bMis = document.getElementById('btn-mismatch');

    function iniciarSecuencia() {
      uiFeed.innerHTML = `<div style="color: #71717a;">Calibrando enfoque...</div>`;
      bStart.style.display = 'none';
      bMatch.style.display = 'none';
      bMis.style.display = 'none';
      
      uiCaja.innerText = "✚";
      uiCaja.style.color = "#3f3f46";

      setTimeout(() => {
        actual = estimulos[Math.floor(Math.random() * estimulos.length)];
        uiCaja.innerText = actual.texto;
        uiCaja.style.color = actual.color;
        
        bMatch.style.display = 'block';
        bMis.style.display = 'block';
        tInicio = performance.now();
      }, Math.random() * 1500 + 800);
    }

    function registrar(respuesta) {
      if (!tInicio) return;
      const latencia = Math.round(performance.now() - tInicio);
      const correcto = respuesta === actual.igual;
      tInicio = 0; // Bloquea múltiples toques

      // Generación de diagnóstico analítico basado en velocidad
      let diagnostico = "";
      let colorDiag = "";
      
      if (!correcto) {
        diagnostico = "Falla de Control Inhibitorio";
        colorDiag = "#ef4444";
      } else if (latencia < 450) {
        diagnostico = "Velocidad Cognitiva Sobresaliente";
        colorDiag = "#10b981";
      } else if (latencia >= 450 && latencia < 700) {
        diagnostico = "Procesamiento Intermedio";
        colorDiag = "#eab308";
      } else {
        diagnostico = "Interferencia Severa (Sobrecarga prefrontal)";
        colorDiag = "#f97316";
      }

      uiFeed.innerHTML = `
        <div class="metric">${latencia} ms</div>
        <div class="analysis" style="color: ${colorDiag}">${diagnostico}</div>
      `;

      bMatch.style.display = 'none';
      bMis.style.display = 'none';
      bStart.style.display = 'block';
      bStart.innerText = "Siguiente Fase";
      uiCaja.innerText = "";
    }
  </script>
</body>
</html>
