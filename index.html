<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Evaluador de Interferencia Stroop</title>
  <style>
    /* Estilos avanzados: Diseño moderno, sombras y modo oscuro */
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --text: #f8fafc;
      --accent: #38bdf8;
    }
    body { 
      font-family: 'Segoe UI', system-ui, sans-serif; 
      background: var(--bg); 
      color: var(--text); 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: center; 
      min-height: 100vh; 
      margin: 0; 
      padding: 20px; 
      text-align: center; 
    }
    .card { 
      background: var(--panel); 
      border-radius: 16px; 
      padding: 2rem; 
      box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
      width: 100%; 
      max-width: 400px; 
      border: 1px solid #334155; 
    }
    h1 { font-size: 1.4rem; margin-top: 0; color: #e2e8f0; }
    .instructions { font-size: 0.95rem; color: #94a3b8; margin-bottom: 2rem; }
    
    /* Caja donde aparece la palabra */
    #stimulus-box { 
      height: 160px; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      background: #020617; 
      border-radius: 12px; 
      margin-bottom: 2rem; 
      font-size: 3.5rem; 
      font-weight: 900; 
      letter-spacing: 2px; 
      border: 2px dashed #334155; 
      transition: all 0.2s ease;
    }
    
    /* Botones y controles */
    .controls { display: flex; gap: 12px; justify-content: center; }
    button { 
      flex: 1; 
      border: none; 
      padding: 16px; 
      font-size: 1rem; 
      font-weight: bold; 
      border-radius: 10px; 
      cursor: pointer; 
      transition: transform 0.1s, filter 0.2s; 
    }
    button:active { transform: scale(0.95); }
    
    #btn-start { background: var(--accent); color: #0f172a; width: 100%; font-size: 1.2rem; }
    #btn-match { background: #22c55e; color: #020617; display: none; }
    #btn-mismatch { background: #ef4444; color: #fff; display: none; }
    
    /* Panel de resultados */
    #results { 
      margin-top: 1.5rem; 
      font-size: 1.1rem; 
      color: #cbd5e1; 
      min-height: 60px; 
      background: #0f172a;
      padding: 10px;
      border-radius: 8px;
    }
    .highlight { color: #38bdf8; font-weight: bold; font-size: 1.3rem;}
  </style>
</head>
<body>
  <div class="card">
    <h1>Análisis Neurocognitivo</h1>
    <p class="instructions">Indica si el <b>COLOR de la tinta</b> coincide con la <b>PALABRA escrita</b>.</p>

    <div id="stimulus-box">LISTO</div>

    <div class="controls" id="control-panel">
      <button id="btn-start" onclick="iniciarPrueba()">Iniciar Estímulo</button>
      <button id="btn-match" onclick="registrarRespuesta(true)">✔️ COINCIDE</button>
      <button id="btn-mismatch" onclick="registrarRespuesta(false)">❌ DIFERENTE</button>
    </div>

    <div id="results">Presiona Iniciar para comenzar.</div>
  </div>

  <script>
    // Matriz de estímulos (Variables para el experimento)
    const estimulos = [
      { texto: "ROJO", color: "#ef4444", esCoincidencia: true },
      { texto: "VERDE", color: "#22c55e", esCoincidencia: true },
      { texto: "AZUL", color: "#38bdf8", esCoincidencia: true },
      { texto: "ROJO", color: "#22c55e", esCoincidencia: false },
      { texto: "VERDE", color: "#38bdf8", esCoincidencia: false },
      { texto: "AZUL", color: "#ef4444", esCoincidencia: false }
    ];

    let tiempoInicio = 0;
    let estimuloActual = null;
    
    // Conexión con la interfaz (DOM)
    const caja = document.getElementById('stimulus-box');
    const btnStart = document.getElementById('btn-start');
    const btnMatch = document.getElementById('btn-match');
    const btnMismatch = document.getElementById('btn-mismatch');
    const txtResultados = document.getElementById('results');

    function iniciarPrueba() {
      // Estado de espera (Fijación visual)
      txtResultados.innerHTML = "Procesando...";
      btnStart.style.display = 'none';
      caja.innerText = "+"; // Punto de enfoque central
      caja.style.color = "#64748b";
      btnMatch.style.display = 'none';
      btnMismatch.style.display = 'none';

      // Retardo aleatorio (evita que el usuario anticipe la respuesta)
      const tiempoEspera = Math.floor(Math.random() * 1500) + 1000;

      setTimeout(() => {
        // Lanzamiento del estímulo
        estimuloActual = estimulos[Math.floor(Math.random() * estimulos.length)];
        caja.innerText = estimuloActual.texto;
        caja.style.color = estimuloActual.color;

        // Mostrar botones de decisión
        btnMatch.style.display = 'block';
        btnMismatch.style.display = 'block';

        // Iniciar cronómetro de alta precisión
        tiempoInicio = performance.now();
      }, tiempoEspera);
    }

    function registrarRespuesta(respuestaUsuario) {
      if (!tiempoInicio) return;
      
      // Cálculo de latencia
      const tiempoReaccion = Math.round(performance.now() - tiempoInicio);
      const fueCorrecto = respuestaUsuario === estimuloActual.esCoincidencia;

      // Diagnóstico instantáneo
      let diagnostico = fueCorrecto ? 
        `<span style="color:#22c55e">✓ Procesamiento Correcto</span>` : 
        `<span style="color:#ef4444">✗ Falla de Inhibición (Error)</span>`;

      // Mostrar resultados en pantalla
      txtResultados.innerHTML = `Latencia: <span class="highlight">${tiempoReaccion} ms</span><br>${diagnostico}`;

      // Reiniciar interfaz para la siguiente prueba
      tiempoInicio = 0;
      btnMatch.style.display = 'none';
      btnMismatch.style.display = 'none';
      btnStart.style.display = 'block';
      btnStart.innerText = "Siguiente Prueba";
    }
  </script>
</body>
</html>
